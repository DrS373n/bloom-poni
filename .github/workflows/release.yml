name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            bloom/src-tauri -> bloom/src-tauri/target
            oyenza-studio -> oyenza-studio/target

      - name: Verify version matches tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('bloom/package.json','utf8')).version)")
          CONF_VERSION=$(bun -e "console.log(JSON.parse(require('fs').readFileSync('bloom/src-tauri/tauri.conf.json','utf8')).version)")
          CARGO_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' bloom/src-tauri/Cargo.toml | head -n 1)

          echo "Tag: $VERSION | package.json: $PKG_VERSION | tauri.conf.json: $CONF_VERSION | Cargo.toml: $CARGO_VERSION"
          if [ "$PKG_VERSION" != "$VERSION" ] || [ "$CONF_VERSION" != "$VERSION" ] || [ "$CARGO_VERSION" != "$VERSION" ]; then
            echo "::error::Version files do not match tag $VERSION. Run 'cd bloom && bun run bump $VERSION' and commit before tagging."
            exit 1
          fi

      - name: Build Oyenza Poni
        run: cargo build --locked --release --package poni --target x86_64-pc-windows-msvc
        working-directory: oyenza-studio

      - name: Install Bloom frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: bloom

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PREV_TAG=$(git tag --sort=-version:refname | grep '^v' | sed -n '2p')
          RANGE="${PREV_TAG:+$PREV_TAG..HEAD}"
          RANGE="${RANGE:-HEAD}"
          NOTES=$(git log "$RANGE" --no-merges --pretty=format:'- %s' -- bloom/src bloom/src-tauri oyenza-studio/crates/poni)
          {
            echo "body<<EOF"
            echo "## Bloom + Oyenza Studio $VERSION"
            echo
            if [ -n "$NOTES" ]; then
              echo "$NOTES"
            else
              echo "Windows installer with Bloom's dock and Oyenza Poni."
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish Windows installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PASSWORD }}
        with:
          projectPath: bloom
          args: --bundles nsis
          tagName: ${{ github.ref_name }}
          releaseName: "Bloom + Oyenza Studio ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
